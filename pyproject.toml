[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-asset-platform"
version = "0.1.0"
description = "Production-grade Multi-Asset Portfolio Intelligence & Allocation Platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Deepmind Advanced Agentic Coding Team" }]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "cvxpy>=1.3.0",
    "sqlalchemy>=2.0.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "dash>=2.9.0",
    "plotly>=5.14.0",
    "xbbg>=0.7.0",
    "pydantic>=2.0.0",
    "structlog>=23.1.0",
    #"blpapi>=3.19.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
    "black>=23.0.0",
    "ruff>=0.0.260",
    "mypy>=1.3.0"
]

# 👉 明确声明 packages（解决 flat layout 报错）
[tool.setuptools]
packages = ["core", "data", "backtest", "dashboard", "backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q --cov=core --cov=backtest --cov=backend"

[tool.ruff]
select = ["E", "F", "I", "B"]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
